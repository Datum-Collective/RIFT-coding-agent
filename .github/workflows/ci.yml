name: ci

# Branch protection on main requires the `typecheck` job, so renaming it here means updating the
# rule too. `test` reports on every PR but does not block: on the Linux runners a few suites fail
# at random (localhost connections refused in session/llm tests, slow browser launches), and a
# required check that fails at random stops every merge. Make it required once those are stable.

on:
  pull_request:
    branches: [main, datum-internal, prototypes, external-fixes]
  push:
    branches: [datum-internal, prototypes, external-fixes]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: opencode
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: opencode/package.json

      - run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: opencode/packages/opencode
        run: bun typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: opencode
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: opencode/package.json

      - run: bun install --frozen-lockfile

      # Never run from the repo root (see AGENTS.md). One bun process per test file: several suites
      # leave browsers, servers and environment changes behind, and in a shared process those made
      # unrelated tests fail at random. attention.test.ts fails on main already and is left out.
      - name: Test
        working-directory: opencode/packages/opencode
        run: |
          failed=0
          for file in $(git ls-files test | grep -E '\.test\.tsx?$' | grep -v 'cli/cmd/tui/attention.test.ts'); do
            bun test --timeout 30000 --max-concurrency=4 "$file" > /tmp/test.log 2>&1 && continue
            failed=1
            echo "::group::FAILED $file"
            cat /tmp/test.log
            echo "::endgroup::"
            echo "::error file=opencode/packages/opencode/$file::tests failed"
          done
          exit $failed
