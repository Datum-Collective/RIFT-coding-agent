name: ci

# What a pull request has to pass before it can merge. Branch protection requires the `check`
# job on main, so renaming it here means updating the rule too.

on:
  pull_request:
    branches: [main, datum-internal, prototypes, external-fixes]
  push:
    branches: [datum-internal, prototypes, external-fixes]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: opencode
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: opencode/package.json

      - run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: opencode/packages/opencode
        run: bun typecheck

      # Never run from the repo root (see AGENTS.md). One bun process per test directory: the whole
      # suite in one process let slow browser tests starve unrelated ones on a runner with 4 cores.
      # attention.test.ts fails on main already and is left out until it is fixed.
      - name: Test
        working-directory: opencode/packages/opencode
        run: |
          failed=0
          groups=$(git ls-files test | grep -E '\.test\.tsx?$' | grep -v 'cli/cmd/tui/attention.test.ts' \
            | awk -F/ '{ if (NF > 2) print $1"/"$2; else print "root" }' | sort -u)
          for group in $groups; do
            if [ "$group" = root ]; then
              files=$(git ls-files test | grep -E '^test/[^/]+\.test\.tsx?$')
            else
              files=$(git ls-files "$group" | grep -E '\.test\.tsx?$' | grep -v 'cli/cmd/tui/attention.test.ts')
            fi
            echo "::group::$group"
            bun test --timeout 30000 --max-concurrency=4 $files || { failed=1; echo "::error::$group failed"; }
            echo "::endgroup::"
          done
          exit $failed
