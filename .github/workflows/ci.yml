name: ci

# Branch protection on main requires the `typecheck` job, so renaming it here means updating the
# rule too. `test` reports on every PR but does not block: on the Linux runners a few suites fail
# at random (localhost connections refused in session/llm tests, slow browser launches), and a
# required check that fails at random stops every merge. Make it required once those are stable.

on:
  pull_request:
    branches: [main, datum-internal, prototypes, external-fixes]
  push:
    branches: [datum-internal, prototypes, external-fixes]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: opencode
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: opencode/package.json

      - run: bun install --frozen-lockfile

      - name: Typecheck core, tui and cli
        run: |
          for package in core tui cli; do
            (cd packages/$package && bun run typecheck)
          done

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: opencode
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: opencode/package.json

      - run: bun install --frozen-lockfile

      # RIFT's own tests, the same set rift/check.sh runs. The full comparison against upstream's suites
      # (rift/regress.py) is too long for a PR check and runs in rift/check.sh before an upstream update.
      - name: RIFT core tests
        working-directory: opencode/packages/core
        run: bun test --timeout 60000 test/plugin/rift-contract.test.ts test/plugin/rift-checks.test.ts test/plugin/rift-integrity.test.ts test/plugin/rift-graph.test.ts test/plugin/rift-deep.test.ts test/plugin/provider/claude-agent

      - name: RIFT tui tests
        working-directory: opencode/packages/tui
        run: bun test --timeout 30000 test/koi test/banner.test.ts test/feature-plugins/rift-sidebar.test.ts test/feature-plugins/rift-sidebar-render.test.tsx test/feature-plugins/rift-log.test.ts test/feature-plugins/rift-go-upsell.test.ts
