name: release

# Tag a commit on main and push it:
#   git tag v0.1.0 && git push origin v0.1.0
# That builds every platform and publishes the archives the installers download.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: opencode
    steps:
      - uses: actions/checkout@v4

      # node-gyp runs during postinstall and needs a newer Node than the runner image ships.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      # Mirrors .github/actions/setup-bun, which cannot be reused directly because a composite
      # action does not inherit this job's working-directory and the monorepo is a level down.
      - name: Resolve the baseline bun build
        id: bun-url
        run: |
          # x64 runners take the baseline build; the standard one assumes CPU features the
          # runner may not have.
          if [ "$RUNNER_ARCH" = "X64" ]; then
            V=$(node -p "require('./package.json').packageManager.split('@')[1]")
            echo "url=https://github.com/oven-sh/bun/releases/download/bun-v${V}/bun-linux-x64-baseline.zip" >> "$GITHUB_OUTPUT"
          fi

      # Bun cross-compiles every target from Linux, so one job covers all twelve.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ${{ !steps.bun-url.outputs.url && 'opencode/package.json' || '' }}
          bun-download-url: ${{ steps.bun-url.outputs.url }}

      - name: Get the bun cache directory
        id: cache
        run: echo "dir=$(bun pm cache)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.cache.outputs.dir }}
          key: ${{ runner.os }}-bun-${{ hashFiles('opencode/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install setuptools for distutils compatibility
        run: python3 -m pip install setuptools || pip install setuptools || true

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          # build.ts uploads to v$VERSION, so a tag that is not semver would silently target a
          # release that does not exist and fail after the whole build had run.
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+' || {
            echo "::error::version must be X.Y.Z, got '$VERSION'"
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - run: command -v zip >/dev/null || sudo apt-get install -y zip

      - run: bun install

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # gh release upload needs the release to exist. Creating it as a draft keeps a
          # half-uploaded release out of releases/latest, which is what the installers read.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --title "$TAG" --generate-notes --draft

      - name: Build every target and upload the archives
        run: ./packages/opencode/script/build.ts
        env:
          # Setting this makes packages/script use the tag verbatim instead of asking npm for
          # the latest opencode-ai version, which is not this fork.
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
          OPENCODE_RELEASE: "1"
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
