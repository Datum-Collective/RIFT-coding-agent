name: release

# Tag a commit on main and push it:
#   git tag v0.1.0 && git push origin v0.1.0
# That builds every platform and publishes the archives the installers download.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    defaults:
      run:
        working-directory: opencode
    steps:
      # A clean build measured about 8.6 GB (3.9 GB of node_modules once every platform's native
      # packages are installed for cross-compiling, 2.7 GB of binaries and archives), on top of
      # the package cache. The runner image ships several toolchains this job never touches;
      # clearing them is the standard way to keep a run from dying of a full disk mid-build.
      - name: Free disk space
        working-directory: .
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - uses: actions/checkout@v4

      # node-gyp runs during postinstall and needs a newer Node than the runner image ships.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      # Mirrors .github/actions/setup-bun, which cannot be reused directly because a composite
      # action does not inherit this job's working-directory and the monorepo is a level down.
      - name: Resolve the baseline bun build
        id: bun-url
        run: |
          # x64 runners take the baseline build; the standard one assumes CPU features the
          # runner may not have.
          if [ "$RUNNER_ARCH" = "X64" ]; then
            V=$(node -p "require('./package.json').packageManager.split('@')[1]")
            echo "url=https://github.com/oven-sh/bun/releases/download/bun-v${V}/bun-linux-x64-baseline.zip" >> "$GITHUB_OUTPUT"
          fi

      # Bun cross-compiles every target from Linux, so one job covers all twelve.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ${{ !steps.bun-url.outputs.url && 'opencode/package.json' || '' }}
          bun-download-url: ${{ steps.bun-url.outputs.url }}

      - name: Get the bun cache directory
        id: cache
        run: echo "dir=$(bun pm cache)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.cache.outputs.dir }}
          key: ${{ runner.os }}-bun-${{ hashFiles('opencode/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install setuptools for distutils compatibility
        run: python3 -m pip install setuptools || pip install setuptools || true

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          # build.ts uploads to v$VERSION, so a tag that is not semver would silently target a
          # release that does not exist and fail after the whole build had run.
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+' || {
            echo "::error::version must be X.Y.Z, got '$VERSION'"
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - run: command -v zip >/dev/null || sudo apt-get install -y zip

      - run: bun install

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # gh release upload needs the release to exist. Creating it as a draft keeps a
          # half-uploaded release out of releases/latest, which is what the installers read.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --title "$TAG" --generate-notes --draft

      - name: Build every target and upload the archives
        run: ./packages/opencode/script/build.ts
        env:
          # Setting this makes packages/script use the tag verbatim instead of asking npm for
          # the latest opencode-ai version, which is not this fork.
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
          OPENCODE_RELEASE: "1"
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}

      - name: Report disk use
        if: always()
        working-directory: .
        run: df -h / | tail -1

      - name: Check every platform was uploaded
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # These are exactly the names opencode/install and opencode/install.ps1 construct.
          # A release missing any one of them 404s for everyone on that platform, so a partial
          # release must never go public.
          expected="
            rift-linux-x64.tar.gz rift-linux-x64-baseline.tar.gz rift-linux-arm64.tar.gz
            rift-linux-x64-musl.tar.gz rift-linux-x64-baseline-musl.tar.gz rift-linux-arm64-musl.tar.gz
            rift-darwin-x64.zip rift-darwin-x64-baseline.zip rift-darwin-arm64.zip
            rift-windows-x64.zip rift-windows-x64-baseline.zip rift-windows-arm64.zip
          "
          have=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          missing=0
          for name in $expected; do
            echo "$have" | grep -qx "$name" || { echo "::error::release is missing $name"; missing=1; }
          done
          [ "$missing" = 0 ] && echo "all 12 platform archives are present"
          exit "$missing"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  # Runs the documented one-line install against the real published release, on the three
  # platforms users are on. This is the only check that exercises a real download: it answers
  # whether macOS binaries cross-compiled on Linux actually run, and whether the Windows
  # installer works against a real archive.
  verify-install:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.release.outputs.version }}
      REPO: ${{ github.repository }}
    steps:
      - name: Install (macOS, Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL "https://raw.githubusercontent.com/$REPO/main/opencode/install" | bash -s -- --version "$VERSION"

      - name: Both commands run, from a fresh shell
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # A brand-new interactive shell is what the user's next terminal window is; the current
          # step's PATH proves nothing about the rc-file edit the installer made.
          for cmd in rift opencode; do
            got=$(bash -ic "$cmd --version" 2>/dev/null | tail -1)
            echo "$cmd --version -> '$got'"
            [ "$got" = "$VERSION" ] || { echo "::error::$cmd reported '$got', expected RIFT '$VERSION'"; exit 1; }
          done

      - name: The binary knows which RIFT release it is
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # The update check compares the embedded release with GitHub, and a build that embedded the
          # wrong one would offer an update to itself on every launch. `--version` is checked above;
          # this asks the same question of `debug info`, which also names the OpenCode runtime.
          got=$(bash -ic "rift debug info" 2>/dev/null | sed -n 's/^rift version: //p' | tail -1)
          echo "rift version (embedded) -> '$got'"
          [ "$got" = "$VERSION" ] || { echo "::error::binary reports RIFT '$got', expected '$VERSION'"; exit 1; }
          # And the installer recorded the same release, which is what it checks before reinstalling.
          recorded=$(tr -d '[:space:]' < "$HOME/.rift/bin/rift.version")
          echo "rift.version (recorded) -> '$recorded'"
          [ "$recorded" = "$VERSION" ] || { echo "::error::installer recorded '$recorded', expected '$VERSION'"; exit 1; }

      - name: macOS signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Apple Silicon refuses to run a binary with no signature at all. Bun ad-hoc signs
          # what it compiles; confirm that survived cross-compiling from Linux.
          codesign -dv "$HOME/.rift/bin/rift" 2>&1 | tee /dev/stderr | grep -q "Signature=adhoc"

      - name: Install and run (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ([scriptblock]::Create((irm "https://raw.githubusercontent.com/$env:REPO/main/opencode/install.ps1"))) -Version $env:VERSION -NoModifyPath
          $bin = Join-Path $env:LOCALAPPDATA 'rift\bin'
          foreach ($cmd in @("$bin\rift.exe", "$bin\opencode.cmd")) {
            $got = (& $cmd --version | Select-Object -Last 1)
            Write-Host "$cmd --version -> '$got'"
            if ($got -ne $env:VERSION) { throw "$cmd reported '$got', expected RIFT '$env:VERSION'" }
          }
          # The update check compares the embedded release with GitHub, and the wrong one would offer
          # an update on every launch; `debug info` states it next to the OpenCode runtime.
          $line = (& "$bin\rift.exe" debug info | Where-Object { $_ -like 'rift version: *' } | Select-Object -Last 1)
          Write-Host "rift version (embedded) -> '$line'"
          if ($line -ne "rift version: $env:VERSION") { throw "binary reports '$line', expected 'rift version: $env:VERSION'" }
          $recorded = (Get-Content (Join-Path $bin 'rift.version') -Raw).Trim()
          if ($recorded -ne $env:VERSION) { throw "installer recorded '$recorded', expected '$env:VERSION'" }

  # A published release that fails verification is worse than none: `releases/latest` is what
  # every installer and `rift upgrade` read. Pull it back to a draft rather than leave it live.
  withdraw-if-broken:
    needs: [release, verify-install]
    if: ${{ always() && needs.verify-install.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft
          echo "::error::$TAG failed install verification and was reverted to a draft"
