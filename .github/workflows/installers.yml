name: installers

# The install scripts are the one part of RIFT with no unit tests and the widest blast radius:
# a syntax error ships a broken `curl | bash` to everyone. These jobs parse both on the
# platforms that actually run them.

on:
  push:
    paths:
      - "opencode/install"
      - "opencode/install.ps1"
      - "opencode/test/install-links.sh"
      - "opencode/test/install-target.ps1"
      - "opencode/test/datum-art.txt"
      - ".github/workflows/installers.yml"
  pull_request:
    paths:
      - "opencode/install"
      - "opencode/install.ps1"
      - "opencode/test/install-links.sh"
      - "opencode/test/install-target.ps1"
      - "opencode/test/datum-art.txt"
  workflow_dispatch:

jobs:
  bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse
        run: bash -n opencode/install
      - name: Lint
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          # Style nits in a 460-line vendored script are noise; syntax and real bugs are not.
          shellcheck --severity=warning opencode/install
      - name: Help text renders
        run: bash opencode/install --help

  # Whether `rift` is actually reachable after an install is the thing users notice, and it depends
  # on the shell and PATH. macOS is included because it still ships bash 3.2, whose parameter
  # expansion has already caused a bug here that newer bash hides.
  links:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install links, never overwrites, falls back to the shell config
        run: bash opencode/test/install-links.sh

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "opencode/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Host "::error::$($_.Message)" }
            exit 1
          }
          Write-Host "install.ps1 parsed with no errors"
      - name: Target selection regression tests (PowerShell 7)
        shell: pwsh
        run: |
          Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force
          & ./opencode/test/install-target.ps1
      - name: Target selection regression tests (Windows PowerShell 5.1)
        shell: powershell
        run: |
          Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force
          & ./opencode/test/install-target.ps1
      - name: Install from a local binary and check both commands
        shell: pwsh
        run: |
          # No release is needed: -BinaryPath exercises the install, alias and PATH paths
          # against a stand-in executable.
          $fake = Join-Path $env:RUNNER_TEMP 'fake-rift.exe'
          Copy-Item "$env:SystemRoot\System32\where.exe" $fake
          $dir = Join-Path $env:RUNNER_TEMP 'riftbin'
          ./opencode/install.ps1 -BinaryPath $fake -InstallDir $dir -NoModifyPath
          if (-not (Test-Path (Join-Path $dir 'rift.exe'))) { throw "rift.exe missing" }
          if (-not (Test-Path (Join-Path $dir 'opencode.cmd'))) { throw "opencode.cmd missing" }
          # Re-run to prove replacing an existing install works.
          ./opencode/install.ps1 -BinaryPath $fake -InstallDir $dir -NoModifyPath
          Write-Host "installed and reinstalled cleanly"
      - name: The banner draws the Datum Software art in every colour mode and layout
        shell: pwsh
        run: |
          # This art is full of backslashes, which PowerShell strings can mangle, and the colour paths
          # only run on a real terminal, so CI forces each one. It runs the installer in a child process
          # because Write-Host output captured in-process is split into one record per colour run.
          $art = Get-Content opencode/test/datum-art.txt | ForEach-Object { $_.TrimEnd() } | Where-Object { $_ }
          $width = ($art | Measure-Object -Property Length -Maximum).Maximum
          $left  = $art | ForEach-Object { $_.PadRight($width).Substring(0, 39).TrimEnd() }
          $right = $art | ForEach-Object { $_.PadRight($width).Substring(43).TrimEnd() }
          $esc = [char]27

          $fake = Join-Path $env:RUNNER_TEMP 'banner-rift.exe'
          Copy-Item "$env:SystemRoot\System32\where.exe" $fake
          $failed = $false

          foreach ($cols in 120, 80) {
            foreach ($mode in 'none', 'legacy', 'vt') {
              $dir = Join-Path $env:RUNNER_TEMP "banner-$cols-$mode"
              $env:RIFT_BANNER_MODE = $mode
              $env:RIFT_BANNER_COLS = $cols
              $out = & pwsh -NoProfile -NonInteractive -File ./opencode/install.ps1 `
                -BinaryPath $fake -InstallDir $dir -NoModifyPath 2>&1 | Out-String

              $lines = ($out -replace "$esc\[[0-9;]*m", '') -split '\r?\n' | ForEach-Object { $_.TrimEnd() }
              $expected = if ($cols -ge 100) { $art } else { @($left) + @($right) }
              $missing = $expected | Where-Object { $lines -notcontains $_ }
              $hasEsc = $out.Contains([string]$esc)

              if ($missing) { Write-Host "::error::[$mode @ $cols] art rows missing or altered: $($missing -join ' | ')"; $failed = $true }
              elseif ($mode -eq 'vt' -and -not $hasEsc) { Write-Host "::error::[$mode @ $cols] no colour codes emitted"; $failed = $true }
              elseif ($mode -ne 'vt' -and $hasEsc) { Write-Host "::error::[$mode @ $cols] emitted escape codes it should not have"; $failed = $true }
              elseif ($out -notmatch 'RIFT includes free models') { Write-Host "::error::[$mode @ $cols] installer did not finish"; $failed = $true }
              else { Write-Host "ok  [$mode @ $cols] art identical to the reference" }
            }
          }
          if ($failed) { exit 1 }
